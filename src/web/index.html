<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>农子财务管理系统</title>
  <!-- 站点图标：与桌面快捷方式使用同一个 .ico，保证窗口标签页与图标一致 -->
  <link rel="icon" href="/pic/%E5%86%9C%E5%AD%90.ico">
  <link rel="apple-touch-icon" href="/pic/%E5%86%9C%E5%AD%90.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 登录 -->
  <div id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1 class="login-title">农子财务管理系统</h1>
      <p class="login-sub">北京农子财务系统 · 本地业务管理</p>

      <label class="field">
        <span class="field-label">工号</span>
        <input id="login-empno" name="empNo" type="text" autocomplete="username" required autofocus>
      </label>

      <label class="field">
        <span class="field-label">密码</span>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </label>

      <p id="login-error" class="form-error" hidden></p>
      <button id="login-submit" type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
  </div>

  <!-- 主界面 -->
  <div id="app-view" class="app-view" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">农</span>
        <span class="brand-text">农子财务管理系统</span>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2 id="page-title" class="page-title">首页</h2>
        <div class="topbar-right">
          <span id="scope-hint" class="scope-hint"></span>
          <span id="current-user" class="user-chip"></span>
          <button id="logout-btn" type="button" class="btn btn-ghost btn-sm">退出</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
